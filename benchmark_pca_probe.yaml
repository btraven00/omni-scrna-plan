name: split-stages-plan
id: split_stages_plan
description: "PCA seed probe: 1 exact vs 3 randomized, terminal at PCA"
benchmarker: "Mark Robinson <mark.robinson@mls.uzh.ch>"

version: "0.0.3"
api_version: "0.4.0"

provenance:
  canonical_url: https://raw.githubusercontent.com/omni-scrna/split-stages-plan/refs/heads/main/benchmark_conda.yaml

software_backend: "conda"

# Design notes, so this is not "modernised" into something that no longer answers
# the question:
#
# * ONE axis varies: NNG `permutation_seed`. Everything upstream is frozen, and
#   `random_seed` is frozen at 42 everywhere including rapids leiden, so the only
#   thing moving is the order cells are stored in -- which is a scientific no-op
#   and should therefore change nothing.
# * Preprocessing is python after FILT (nr-scanpy -> fe-scanpy -> pc-scanpy) to
#   avoid repeated heavy R reads. FILT has no python module in this benchmark
#   (fi-scrapper is the only one), but it is a single frozen job so the R
#   exposure is one cheap run.
# * PCA is pc-scanpy/arpack: exact and deterministic, so PCA contributes no
#   variance and is not part of the budget under test.
# * NO GRAPH-M. nn-metrics-r is ~55min and ~2GB per job at this scale and is
#   R-only; across permutations it would dominate the run while answering a
#   question CLUST-M already covers. NO EMBED-M either (~30GB per job).
# * be1 is 1715 cells, BELOW scanpy's 8192-cell exact-backend threshold, so the
#   ANN seed is inert here by construction (verified separately: 100 seeds give
#   byte-identical graphs). That does not weaken this slice -- the axis under
#   test is cell ORDER, which acts through leiden and is live at any scale. It
#   does mean this run cannot say anything about kNN-seed sensitivity.
# * The upstream arms below are chosen to match what already exists in out_pbmc,
#   so DATA/FILT/NORM/FEAT/PCA are reused rather than recomputed. Run with
#   `--out-dir out_pbmc -- --rerun-triggers mtime`. Changing the DATA `uri` (for
#   example to a published URL) changes its parameter hash and therefore
#   discards that reuse -- a full recompute, several hours and a 2.6GB refetch.

software_environments:
  scanpy:
    name: scanpy multi-module
    conda: envs/scanpy.yml
  py_conda:
    name: Python conda env
    conda: envs/py.yml
  scrapper:
    name: scrapper multi-module
    conda: envs/scrapper.yml
  metrics:
    name: metrics env
    conda: envs/metrics.yaml
  omni_data:
    name: omni-data fixture loader
    conda: envs/omni-data-pinned.yml
  rapids_singlecell:
    name: rapids-singlecell (GPU)
    conda: envs/rapids.yml
  pgs:
    name: PyGenStability (Markov Stability)
    conda: envs/pgs.yml

stages:
  - id: DATA
    outputs:
      - id: rawdata_h5ad
        path: "{dataset}.h5ad"
      - id: rawdata_clusters_truth
        path: "{dataset}.clusters_truth.tsv"
      - id: rawdata_clusters_truth_num
        path: "{dataset}.clusters_truth_num.txt"
      - id: properties_info
        path: "{dataset}_properties.yaml"
    modules:
      # Ingestion check for omni-tabula-muris. file:// directory mode serves the
      # whole dir, which is exactly the four-file DATA contract build.py writes
      # (h5ad + clusters_truth.tsv + clusters_truth_num.txt + _properties.yaml).
      # Non-reproducible by design -- fine for a smoke test, republish to
      # omnibenchmark.mls.uzh.ch before this dataset is used for results.
      - id: tm-facs-marrow
        name: "Tabula Muris FACS marrow via omni-data (local directory)"
        software_environment: omni_data
        repository:
          url: https://github.com/btraven00/omni-data
          commit: 80611e83d13c8bd0d15fbc033c6a5e1a7900a0b8
        parameters:
          - uri: file:///home/b/phd/data/tm_omnidata/tm-facs-marrow/
            uri_type: directory

  - id: FILT
    inputs:
      - rawdata_h5ad
      - properties_info
    outputs:
      - id: filtered_cellids
        path: "{dataset}_cellids.txt.gz"
    modules:
      - id: fi-scrapper
        name: "scrapper-style filtering"
        software_environment: "scrapper"
        repository:
          url: https://github.com/omni-scrna/scrapper
          commit: 18843a7
          entrypoint: filter

  - id: NORM
    inputs:
      - rawdata_h5ad
      - filtered_cellids
    outputs:
      - id: normalized_h5
        path: "{dataset}_normalized.h5"
    modules:
      - id: nr-scanpy
        name: "Python-based scRNA-seq normalization methods"
        software_environment: "py_conda"
        repository:
          url: https://github.com/omni-scrna/scanpy
          commit: 53eb292
          entrypoint: normalize
        parameters:
          - flavor: ["log1pCP10k"]

  - id: FEAT
    inputs:
      - rawdata_h5ad
      - normalized_h5
      - filtered_cellids
      - properties_info
    outputs:
      - id: normalized_selected_h5
        path: "{dataset}_normalized_selected.h5"
    modules:
      - id: fe-scanpy
        name: "scanpy-based gene selection"
        software_environment: "scanpy"
        repository:
          url: https://github.com/omni-scrna/scanpy
          commit: 53eb292
          entrypoint: feat-select
        parameters:
          - flavor: ["scanpy_seurat"]
            number_selected: 2000

  - id: PCA
    resources:
      cores: 8
    inputs:
      - normalized_selected_h5
    outputs:
      - id: pcas_tsv
        path: "{dataset}_pcas.tsv"
      - id: loadings_tsv
        path: "{dataset}_loadings.tsv"
    modules:
      # arpack: exact and deterministic, so PCA adds no variance of its own.
      # 1 exact: deterministic, so it contributes zero variance by construction
      # and calibrates what "no seed effect" looks like.
      - id: pc-scrapper-exact
        name: "scrapper PCA, exact"
        software_environment: "scrapper"
        repository:
          url: https://github.com/omni-scrna/scrapper
          commit: 18843a7
          entrypoint: pca
        parameters:
          - solver: exact
            n_components: 50
            random_seed: 42

      # n randomized: irlba's seed feeds its INITIAL RANDOM VECTOR (pca.R says
      # so explicitly and passes it as an argument, not via set.seed). This is
      # the axis pc-scanpy could not provide -- its `randomized` is coerced to
      # arpack on sparse input.
      - id: pc-scrapper-rand
        name: "scrapper PCA, irlba"
        software_environment: "scrapper"
        repository:
          url: https://github.com/omni-scrna/scrapper
          commit: 18843a7
          entrypoint: pca
        parameters:
          - solver: irlba
            n_components: 50
            random_seed: [1, 2, 3]

      # GPU randomized. The scanpy module's docstring names this arm as one of
      # the genuinely seed-sensitive ones; the two CPU arms measured inert.
      - id: pc-rapids-rand
        name: "rapids-singlecell PCA, randomized-halko (GPU)"
        software_environment: "rapids_singlecell"
        repository:
          # local checkout: 0b566d6 + the to_host() fix for device arrays.
          # Needs --dirty until the fix is pushed.
          url: /home/b/lab/omni-scrna/split-stages-plan-modules/rapids-singlecell
          commit: 36ba4cd
          entrypoint: pca
        parameters:
          - solver: randomized-halko
            n_components: 50
            random_seed: [1, 2, 3]

      # The proposed EXACT control, swept over seeds on purpose: a control is
      # only a control if it is provably constant. covariance-eigh forms the
      # Gram matrix and does a full eigendecomposition, but this is a GPU
      # reduction, so verify rather than assume.
      - id: pc-rapids-exact
        name: "rapids-singlecell PCA, covariance-eigh (GPU)"
        software_environment: "rapids_singlecell"
        repository:
          url: /home/b/lab/omni-scrna/split-stages-plan-modules/rapids-singlecell
          commit: 36ba4cd
          entrypoint: pca
        parameters:
          - solver: covariance-eigh
            n_components: 50
            random_seed: [1, 2, 3]
