name: Fixture run

# Runs the plan on the tiny committed fixture in fixtures/DATA (ci/fixture-plan.sh
# swaps DATA for it), selected by filters/ci-until-pca.yaml: first combo per
# module, DATA..PCA plus the PCA_M/REPORT gathers, CPU arms. Then runs the
# declared output validators. Proves the modules execute and their stage
# contracts line up, without the 817 MB real dataset.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Nightly on main: module env files are not version-locked, so the same plan
  # can solve to different packages from one day to the next. Catches that drift
  # even when nothing in the repo changed. (Schedules run on the default branch.)
  schedule:
    - cron: "17 3 * * *"

jobs:
  fixture-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No disk cleanup: ubuntu-latest has ~86 GB free on / and this run needs
      # ~20-25 GB (cached conda envs + pixi). The cleanup step cost ~5 min.
      - name: Disk space
        run: df -h /

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.10
        with:
          environments: plan validation
          frozen: false
          locked: false

      - name: Derive fixture plan
        run: pixi run -e plan ci/fixture-plan.sh > benchmark_ci.yaml

      # Cache the per-module conda envs snakemake builds (the slow part).
      # Keyed on the env specs + the omni-data pin so it invalidates on change.
      # Restore-only: we save explicitly after the env build below, so the
      # built envs persist even if the run step later OOMs (a host kill skips
      # the implicit post-cache save).
      - name: Restore module conda envs
        id: conda-cache
        uses: actions/cache/restore@v4
        with:
          path: out_ci/.snakemake/conda
          key: snakemake-conda-${{ runner.os }}-${{ hashFiles('envs/*.yml', 'envs/*.yaml', 'ci/fixture-plan.sh', 'filters/ci-until-pca.yaml') }}
          # Partial restore on an exact-key miss: snakemake reuses every
          # hash-named env that still matches and rebuilds only the changed
          # one(s), instead of re-solving all modules from scratch.
          restore-keys: |
            snakemake-conda-${{ runner.os }}-

      # Build the per-module conda envs without running any module. Isolates an
      # env-build OOM from a module OOM, and gives us a cache to save.
      - name: Build module conda envs
        run: |
          pixi run -e plan ob run benchmark_ci.yaml --filter filters/ci-until-pca.yaml \
            --out-dir out_ci --cores 4 --yes -- --conda-create-envs-only

      - name: Save module conda envs
        if: always() && steps.conda-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: out_ci/.snakemake/conda
          key: snakemake-conda-${{ runner.os }}-${{ hashFiles('envs/*.yml', 'envs/*.yaml', 'ci/fixture-plan.sh', 'filters/ci-until-pca.yaml') }}

      - name: Run fixture benchmark (DATA..PCA + PCA_M/REPORT)
        run: |
          pixi run -e plan ob run benchmark_ci.yaml --filter filters/ci-until-pca.yaml \
            --out-dir out_ci --cores 4 --yes

      # Validators need python3/Rscript with h5py, scanpy, readr: the validation
      # env first on PATH. Call the plan env's ob directly: `pixi run -e plan`
      # would put the plan env (no h5py) back in front. ob reads pass/fail from
      # each validator's exit code.
      - name: Run output validators
        run: |
          export PATH="$PWD/.pixi/envs/validation/bin:$PATH"
          .pixi/envs/plan/bin/ob validate outputs benchmark_ci.yaml --out-dir out_ci -c 4
          fails=$(grep -l '"exit_code": [1-9]' $(find out_ci/.validation -name '*.json' -not -path '*/scripts/*') 2>/dev/null | wc -l)
          echo "validator failures: $fails"
          [ "$fails" -eq 0 ]

      - name: Summarize outputs
        if: always()
        run: |
          {
            echo "## Fixture run results"
            echo
            echo "Module outputs produced:"
            echo '```'
            find out_ci -type f \
              \( -name '*.h5ad' -o -name '*.h5' -o -name '*.tsv' \
                 -o -name '*.json' -o -name '*.txt.gz' \) \
              -not -path '*/.snakemake/*' | sort
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # tar it ourselves: upload-artifact's globber doesn't reliably descend
      # into hidden dirs (every output sits under .<hash>/ param dirs), and tar
      # also preserves the symlinks under .modules. Exclude the multi-GB built
      # conda envs (cached separately).
      - name: Package run outputs
        if: always()
        run: |
          tar czf fixture-run-out.tar.gz \
            --exclude='out_ci/.snakemake/conda' \
            $( [ -d out_ci ] && echo out_ci ) \
            $( [ -f benchmark_ci.yaml ] && echo benchmark_ci.yaml )

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixture-run-out
          path: fixture-run-out.tar.gz
          retention-days: 7
