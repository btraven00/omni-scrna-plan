name: split-stages-plan
id: split_stages_plan
description: This benchmark lays out stages for each step of an scRNA-seq pipeline
benchmarker: "Mark Robinson <mark.robinson@mls.uzh.ch>"

# Benchmark configuration
version: "0.0.3"
api_version: "0.4.0"

provenance:
  canonical_url: https://raw.githubusercontent.com/omni-scrna/split-stages-plan/refs/heads/main/benchmark_conda.yaml

# Remote artifact storage
storage:
  api: S3
  endpoint: https://omnibenchmark.mls.uzh.ch
  bucket_name: split-stages-plan

# The default software environment for this benchmark.
# One of: apptainer, conda, envmodules.
software_backend: "conda"

# Available software environments
software_environments:
  r_conda:
    name: R conda env (some packages self built)
    conda: envs/r.yml
  scanpy:
    name: scanpy multi-module
    conda: envs/scanpy.yml
  scrapper:
    name: scrapper multi-module
    conda: envs/scrapper.yml
  seurat:
    name: seurat multi-module
    conda: envs/seurat.yml
  metrics:
    name: metrics env
    conda: envs/metrics.yaml
  py_conda:
    name: Python conda env
    conda: envs/py.yml
  integrate:
    name: integration env
    conda: envs/integrate.yml
  annotate:
    name: annotate env
    conda: envs/annotate.yml
  integrate-py:
    name: integration env
    conda: envs/integrate-py.yml
  count-factor:
    name: count-factor
    conda: envs/cntfct.yml
  sklearn:
    name: sklearn multi-module
    conda: envs/sklearn.yml

stages:
  - id: DATA
    outputs:
      - id: rawdata_h5ad
        path: "{dataset}.h5ad"
      - id: rawdata_clusters_truth
        path: "{dataset}.clusters_truth.tsv"
      - id: rawdata_clusters_truth_num
        path: "{dataset}.clusters_truth_num.txt"
      - id: properties_info
        path: "{dataset}_properties.yaml"
    modules:
      - id: d-integration
        name: "R-based dataset downloads (integration collection)"
        software_environment: r_conda
        repository:
          url: https://github.com/omni-scrna/1-data
          commit: 607208a
        parameters:
          - dataset_name: "be1"
            batch_var: Sample
            labels_var: clusters.truth
            sample_var: Sample
          - dataset_name: "pancreas"
            batch_var: study
            labels_var: clusters.truth
            sample_var: study
      - id: d-pca
        name: "R-based dataset downloads (PCA collection)"
        software_environment: r_conda
        repository:
          url: https://github.com/omni-scrna/1-data
          commit: 607208a
        parameters:
          - dataset_name: "sc-mix"
            batch_var: null
            labels_var: cell_line
            sample_var: null
      - id: d-feat-sel
        name: "R-based dataset downloads (feature selection collection)"
        software_environment: r_conda
        repository:
          url: https://github.com/omni-scrna/1-data
          commit: 607208a
        parameters:
          - dataset_name: "be1-subset"
            batch_var: Sample
            labels_var: Sample
            sample_var: Sample
      - id: d-annotation
        name: "R-based dataset downloads (cell type annotation collection)"
        software_environment: r_conda
        repository:
          url: https://github.com/omni-scrna/1-data
          commit: 607208a
        parameters:
          - dataset_name: "cb"
            batch_var: species
            labels_var: celltype
            sample_var: species

  - id: FILT
    inputs:
      - rawdata_h5ad
      - properties_info
    outputs:
      - id: filtered_cellids
        path: "{dataset}_cellids.txt.gz"
      - id: filtered_featureids
        path: "{dataset}_featureids.txt.gz"
      - id: size_factor_tsv
        path: "{dataset}_size_factors.tsv"
    modules:
      - id: fi-scrapper
        name: "scrapper-style filtering"
        software_environment: "scrapper"
        repository:
          url: https://github.com/omni-scrna/scrapper
          commit: f201861
          entrypoint: filter

  - id: NORM
    inputs:
      - rawdata_h5ad
      - filtered_cellids
      - filtered_featureids
    outputs:
      - id: normalized_h5
        path: "{dataset}_normalized.h5"
    modules:
      - id: nr-scrapper
        name: "scrapper-based normalization"
        software_environment: "scrapper"
        repository:
          url: https://github.com/omni-scrna/scrapper
          commit: f201861
          entrypoint: normalize
      - id: nr-scanpy
        name: "Python-based scRNA-seq normalization methods"
        software_environment: "py_conda"
        repository:
          url: https://github.com/omni-scrna/scanpy
          commit: b5c6855
          entrypoint: normalize
        parameters:
          - flavor: ["log1pCP10k", "analyticalPearsonResiduals"]
      - id: nr-seurat
        name: "Seurat-based scRNA-seq normalization methods"
        software_environment: "seurat"
        repository:
          url: https://github.com/omni-scrna/seurat
          commit: 47b8e31
          entrypoint: normalize
        parameters:
          - flavor: ["sctransformv2"]
            random_seed: 42

  - id: FEAT
    inputs:
      - rawdata_h5ad
      - normalized_h5
      - filtered_cellids
      - filtered_featureids
      - properties_info
    outputs:
      - id: normalized_selected_h5
        path: "{dataset}_normalized_selected.h5"
    modules:
      - id: fe-seurat
        name: "seurat-based gene selection"
        software_environment: "seurat"
        exclude:
          - d-pca
        repository:
          url: https://github.com/omni-scrna/seurat
          commit: db6c6ba
          entrypoint: select
        parameters:
          - selection_type: ["seurat_vst", "seurat_vst_batch"]
            number_selected: 2000
      - id: fe-scrapper
        name: "scrapper-based gene selection"
        software_environment: "scrapper"
        exclude:
          - d-pca
        repository:
          url: https://github.com/omni-scrna/scrapper
          commit: f201861
          entrypoint: select
        parameters:
          - number_selected: 2000
      - id: fe-scanpy
        name: "scanpy-based gene selection"
        software_environment: "scanpy"
        exclude:
          - d-pca
        repository:
          url: https://github.com/omni-scrna/scanpy
          commit: 2a56c14
          entrypoint: feat-select
        parameters:
          - flavor: ["pearson_residuals"]
            number_selected: 2000
          #- flavor: ["pearson_residuals", "scanpy_seurat", "scanpy_cell_ranger"]

  - id: PCA
    resources:
      cores: 4
    inputs:
      - normalized_selected_h5
    outputs:
      - id: embedding_tsv
        path: "{dataset}_embedding.tsv"
      - id: loadings_tsv
        path: "{dataset}_loadings.tsv"
    modules:
      - id: pc-scanpy
        name: "scanpy PCA"
        software_environment: "scanpy"
        exclude:
          - d-feat-sel
          - d-annotation
        repository:
          url: https://github.com/omni-scrna/scanpy
          commit: b41bf43
          entrypoint: pca
        parameters:
          - solver: [arpack]
            dense: "false"
            n_components: 50
            random_seed: 42
          - solver: [randomized]
            dense: "true"
            n_components: 50
            random_seed: 42
      - id: pc-scrapper
        name: "scrapper PCA"
        software_environment: "scrapper"
        exclude:
          - d-feat-sel
          - d-annotation
        repository:
          url: https://github.com/omni-scrna/scrapper
          commit: f201861
          entrypoint: pca
        parameters:
          - solver: [exact, irlba, random]
            n_components: 50
            random_seed: 42

  - id: ISOMAP
    resources:
      cores: 4
    inputs:
      - normalized_selected_h5
    outputs:
      - id: embedding_tsv
        path: "{dataset}_embedding.tsv"
      - id: geodesics_h5
        path: "{dataset}_geodesics.h5"
    modules:
      - id: dr-isomap
        name: "sklearn (landmark) Isomap"
        software_environment: "sklearn"
        repository:
          url: https://github.com/omni-scrna/sklearn
          commit: 00d3afc
          entrypoint: isomap
        parameters:
          - n_neighbors: [30]
            n_components: 50
            n_landmarks: 1000
            landmark_method: min-max
            random_seed: 42

  - id: EMBED-M
    inputs:
      - embedding_tsv
      - rawdata_clusters_truth
    outputs:
      - id: embedding_metrics
        path: "{dataset}_embedding_metrics.json"
    modules:
      - id: em-metrics-r
        name: "Embedding metrics in R"
        software_environment: "metrics"
        repository:
          url: https://github.com/omni-scrna/metrics
          commit: e651115
          entrypoint: embedding-r
      #- id: em-metrics-py
      #  name: "Embedding metrics in python"
      #  software_environment: "metrics"
      #  repository:
      #    url: https://github.com/omni-scrna/metrics
      #    commit: main
      #    entrypoint: embedding-py

  - id: NNG
    inputs:
      - embedding_tsv
    outputs:
      - id: neighbors_h5
        path: "{dataset}_neighbors.h5"
    modules:
      - id: nn-scanpy
        name: "scanpy KNN graph"
        software_environment: "scanpy"
        exclude:
          - cntfct
        repository:
          url: https://github.com/omni-scrna/scanpy
          commit: b41bf43
          entrypoint: knn
        parameters:
          - n_neighbors: 15
            random_seed: 42
            flavor: "umap"

  - id: GRAPH-M
    inputs:
      - neighbors_h5
      - rawdata_clusters_truth
    outputs:
      - id: graph_metrics
        path: "{dataset}_graph_metrics.json"
    modules:
      - id: nn-metrics-r
        name: "Graph metrics in R"
        software_environment: "metrics"
        repository:
          url: https://github.com/omni-scrna/metrics
          commit: 646f1e4
          entrypoint: graph-r

  - id: CLUST
    inputs:
      - neighbors_h5
    outputs:
      - id: clusters_tsv
        path: "{dataset}_clusters.tsv"
    modules:
      - id: cl-scanpy
        name: "scanpy Leiden clustering"
        software_environment: "scanpy"
        repository:
          url: https://github.com/omni-scrna/scanpy
          commit: b41bf43
          entrypoint: cluster
        parameters:
          - flavor: ["igraph", "leidenalg"]
            resolution: [0.5, 1.0]
            random_seed: 42
      - id: cl-seurat
        name: "Seurat clustering"
        software_environment: "seurat"
        repository:
          url: https://github.com/omni-scrna/seurat
          commit: 537d178
          entrypoint: cluster
        parameters:
          - resolution: [0.5, 1.0]
            random_seed: 42
            flavor: ["leiden", "louvain_original"]
        #repository:
        #  url: https://github.com/omni-scrna/seurat
        #  commit: add-clustering
        #  entrypoint: clustering
        #parameters:
        #  - modularity_algorithm: ["louvain_original"]
        #    resolution: [0.5, 1.0]
        #    random_seed: 42
        #  #- modularity_algorithm: ["louvain_original", "louvain_multilevel_refinement", "slm", "leiden"]
      - id: cl-scrapper
        name: "Scrapper clustering"
        software_environment: "scrapper"
        repository:
          url: https://github.com/omni-scrna/scrapper
          commit: 8a1cfd8
          entrypoint: cluster
        parameters:
          - flavor: ["leiden_modularity", "leiden_cpm", "multilevel", "walktrap"]
            resolution: [0.5, 1.0]
            walktrap_steps: [2, 4]
            random_seed: 42

  - id: CLUST-M
    inputs:
      - clusters_tsv
      - rawdata_clusters_truth
    outputs:
      - id: cluster_metrics
        path: "{dataset}_cluster_metrics.json"
    modules:
      - id: cl-metrics-r
        name: "Partition metrics in R"
        software_environment: "metrics"
        repository:
          url: https://github.com/omni-scrna/metrics
          commit: 257c952
          entrypoint: cluster-r

  # Floor and ceiling for what any clustering of this embedding could recover.
  # Emits a partition under CLUST's own `clusters_tsv` id -- it scores nothing
  # itself, so CLUST-M picks it up and poem scores a bound with the exact call
  # it makes on a real arm. That is the point: a bound and an arm are the same
  # number by construction, not because two implementations were checked
  # against each other (sklearn and poem normalise AMI differently).
  #
  # Needs an ob with shared-output-id fan-in (gather-lean-3) -- CLUST and
  # CLUSTBOUND both produce clusters_tsv, and on main CLUST-M silently takes
  # only one producer. pixi.toml already pins that branch.
  #
  # Reads only (embedding_tsv, truth), never a CLUST arm, so one pair brackets
  # every clustering downstream of an embedding -- and it fans in over PCA,
  # ISOMAP and CNTFCT for free, since all three emit embedding_tsv.
  - id: CLUSTBOUND
    inputs:
      - embedding_tsv
      - rawdata_clusters_truth
    outputs:
      - id: clusters_tsv
        path: "{dataset}_clusters.tsv"
    modules:
      # Chance floor: a uniform random partition at k. ARI/AMI are chance-
      # corrected so this scores ~0; the spread is the number a weak arm has to
      # clear, and it is not negligible when k is large relative to n. One run
      # is one draw -- the seed sweep is what makes the distribution, the same
      # way permutation_seed is swept on NNG.
      - id: cb-chance
        name: "Chance floor (label permutation)"
        software_environment: "metrics"
        repository:
          url: https://github.com/omni-scrna/metrics
          commit: main   # repin once bounds-py lands
          entrypoint: bounds-py
        parameters:
          - bound: chance
            n_clusters: [0, 10, 20]   # 0 = the truth's own k
            random_seed: [1, 2, 3, 4, 5]
      # Supervised ceiling. Not a strict upper bound -- a clusterer could in
      # principle beat a given classifier -- but if the oracle is also low, the
      # embedding does not carry the labels and no CLUST arm was ever going to
      # score well. Two classifiers because the ceiling is only as good as the
      # classifier: take the max of the arms. Boosting is deliberately absent --
      # on tm-facs-marrow it returns ARI 0.07 where these return 0.88, which
      # would read as a dead embedding. It stays behind --classifier hgb.
      - id: cb-oracle
        name: "Supervised ceiling"
        software_environment: "metrics"
        repository:
          url: https://github.com/omni-scrna/metrics
          commit: main   # repin once bounds-py lands
          entrypoint: bounds-py
        parameters:
          - bound: oracle
            classifier: [logreg, knn]
            n_splits: 5
            random_seed: 42

  - id: INTG8
    inputs:
      - embedding_tsv
      - loadings_tsv
      - normalized_selected_h5
      - rawdata_h5ad
      - properties_info
    outputs:
      - id: corrected_tsv
        path: "{dataset}_corrected.tsv"
    modules:
      - id: in-harmony
        name: "Harmony batch correction"
        software_environment: "integrate"
        exclude:
          - cntfct
          - d-pca
          - d-annotation
          - d-feat-sel
          - cntfct
        repository:
          url: https://github.com/omni-scrna/7-integrate
          commit: 52c6c64
          entrypoint: harmony-r
        parameters:
          - theta: [0.1, 2]
      - id: in-seurat
        name: "Seurat IntegrateLayers batch correction"
        software_environment: "seurat"
        exclude:
          - cntfct
          - d-pca
          - d-annotation
          - d-feat-sel
          - cntfct
        repository:
          url: https://github.com/omni-scrna/seurat
          commit: db6c6ba
          entrypoint: integrate
        parameters:
          - method: [rpca]
            k_anchor: [5, 20]
      - id: in-scanorama
        name: "Scanorama batch correction"
        software_environment: "integrate-py"
        exclude:
          - cntfct
          - d-pca
          - d-annotation
          - d-feat-sel
          - cntfct
        repository:
          url: https://github.com/omni-scrna/7-integrate-py
          commit: e005eb5
          entrypoint: scanorama
        parameters:
          - knn: [20]
            sigma: [15]

  - id: INTG8-M
    inputs:
      - corrected_tsv
      - rawdata_clusters_truth
      - rawdata_h5ad
      - properties_info
      - embedding_tsv
      - clusters_corrected_tsv
    outputs:
      - id: integration_metrics
        path: "{dataset}_integration_metrics.json"
    modules:
      - id: in-metrics-r
        name: "Integration metrics in R"
        software_environment: "metrics"
        repository:
          url: https://github.com/omni-scrna/metrics
          commit: f0a85a3
          entrypoint: integration-r
        parameters:
          - k: 20 # knn size for CellMixS cms/entropy/isi (evalIntegration)
            n_dim: 10 # corrected-embedding dims used as the CellMixS subspace
            cell_min: 10 # min cells per batch for cms's Anderson-Darling test
            ldf_k: 75 # knn size for CellMixS ldfDiff (matches ldfDiff's own default)
            ldf_n_dim: 20 # pre/post dims used for ldfDiff's LDF subspace (matches ldfDiff's own default)
      - id: in-metrics-py
        name: "Integration metrics in python (scib-metrics + sklearn)"
        software_environment: "metrics"
        repository:
          url: https://github.com/omni-scrna/metrics
          commit: f0a85a3
          entrypoint: integration-py
        parameters:
          - n_neighbors: 90 # knn graph size for clisi_knn (pynndescent)
            random_state: 0 # random seed for the pynndescent approximate KNN search

  - id: NNG-C
    inputs:
      - corrected_tsv
    outputs:
      - id: neighbors_corrected_h5
        path: "{dataset}_neighbors.h5"
    modules:
      - id: nn-scanpy-c
        name: "scanpy KNN graph (corrected embedding)"
        software_environment: "scanpy"
        repository:
          url: https://github.com/omni-scrna/scanpy
          commit: b41bf43
          entrypoint: knn
        parameters:
          - n_neighbors: 15
            random_seed: 42
            flavor: "umap"

  - id: CLUST-C
    inputs:
      - neighbors_corrected_h5
    outputs:
      - id: clusters_corrected_tsv
        path: "{dataset}_clusters.tsv"
    modules:
      - id: cl-scanpy-c
        name: "scanpy Leiden clustering (corrected embedding)"
        software_environment: "scanpy"
        repository:
          url: https://github.com/omni-scrna/scanpy
          commit: b41bf43
          entrypoint: cluster
        parameters:
          - flavor: ["igraph", "leidenalg"]
            resolution: [0.5, 1.0]
            random_seed: 42

  - id: CLUST-E
    inputs:
      - embedding_tsv
    outputs:
      - id: clusters_embedding_tsv
        path: "{dataset}_clusters.tsv"
    modules:
      - id: cluster-optics
        name: "scikit-learn OPTICS clustering"
        software_environment: "py_conda"
        repository:
          url: https://github.com/omni-scrna/clustering-py
          commit: 8b6a00a
          entrypoint: cluster
        parameters:
          - min_samples: [10, 30, 50]
            algorithm: ["ball_tree", "kd_tree", "brute"]
            metric: ["euclidean", "manhattan"]
            cluster_method: "xi"
            xi: 0.05
            random_seed: 42
          - min_samples: [10, 30, 50]
            algorithm: "brute"
            metric: "cosine"
            cluster_method: "xi"
            xi: 0.05
            random_seed: 42

  - id: ANNO
    inputs:
      - normalized_selected_h5
    outputs:
      - id: annotations_tsv
        path: "{dataset}_annotations.tsv"
    modules:
      - id: an-singler
        name: singler annotation
        software_environment: annotate
        repository:
          url: https://github.com/omni-scrna/9-annotate
          commit: 439981c
        parameters:
          - reference: ["HumanPrimaryCellAtlasData", "BlueprintEncodeData"]

  - id: ANNO-M
    inputs:
      - annotations_tsv
      - rawdata_clusters_truth
    outputs:
      - id: annotation_metrics
        path: "{dataset}_annotation_metrics.json"
    modules:
      - id: an-metrics-r
        name: "Annotation metrics in R"
        software_environment: "metrics"
        repository:
          url: https://github.com/omni-scrna/metrics
          commit: 4cfb831
          entrypoint: annotation-r

  - id: CNTFCT
    resources:
      cores: 4
    inputs:
      - normalized_selected_h5
      - rawdata_h5ad
      - filtered_cellids
    outputs:
      - id: embedding_tsv
        path: "{dataset}_embedding.tsv"
      - id: loadings_tsv
        path: "{dataset}_loadings.tsv"
    modules:
      - id: cntfct
        name: count-factor
        software_environment: count-factor
        repository:
          url: https://github.com/omni-scrna/count-factor
          commit: ec9badb
        parameters:
          - factorization_type: ["newwave", "scgbm", "glmpca"]
            n_dim: 4
            random_seed: 42

  - id: NORM-M
    inputs:
      - embedding_tsv
      - size_factor_tsv
    outputs:
      - id: normalization_metrics
        path: "{dataset}_normalization_metrics.json"
    modules:
      - id: nm-metrics-r
        name: "Normalization metrics in R"
        software_environment: "metrics"
        repository:
          url: https://github.com/omni-scrna/metrics
          commit: c8d28ac
          entrypoint: normalization-r
