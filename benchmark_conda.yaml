name: split-stages-plan
id: split_stages_plan
description: This benchmark lays out stages for each step of an scRNA-seq pipeline
benchmarker: "Mark Robinson <mark.robinson@mls.uzh.ch>"

# Benchmark configuration
version: "0.1.0"
api_version: "0.4.0"

provenance:
  canonical_url: https://raw.githubusercontent.com/omni-scrna/split-stages-plan/refs/heads/main/benchmark_conda.yaml

# Remote artifact storage
storage:
  api: S3
  endpoint: https://omnibenchmark.mls.uzh.ch
  bucket_name: split-stages-plan

# The default software environment for this benchmark.
# One of: apptainer, conda, envmodules.
software_backend: "conda"

# Available software environments
software_environments:
  r_conda:
    name: R conda env (some packages self built)
    conda: envs/r.yml
  scanpy:
    name: scanpy multi-module
    conda: envs/scanpy.yml
  scrapper:
    name: scrapper multi-module
    conda: envs/scrapper.yml
  seurat:
    name: seurat multi-module
    conda: envs/seurat.yml
  metrics:
    name: metrics env
    conda: envs/metrics.yaml
  py_conda:
    name: Python conda env
    conda: envs/py.yml
  integrate:
    name: integration env
    conda: envs/integrate.yml
  annotate:
    name: annotate env
    conda: envs/annotate.yml
  integrate-py:
    name: integration env
    conda: envs/integrate-py.yml
  count-factor:
    name: count-factor
    conda: envs/cntfct.yml
  sklearn:
    name: sklearn multi-module
    conda: envs/sklearn.yml
  # The rapids modules are GPU-only, so they declare `requires_capabilities: [gpu]`
  # and are pruned from the DAG unless the run passes `--with-capability gpu`.
  # That field needs omnibenchmark >= 0.7.0; older versions ignore it and would
  # schedule these modules on a CPU host; comment the modules by hand if you're on 0.6.0
  rapids_singlecell:
    name: rapids-singlecell (GPU)
    conda: envs/rapids-singlecell.yml
  rcppml:
    name: RcppML env (r-rcppml 1.0.0 from the almost-conductor channel; ships RcppML_gpu.so)
    conda: envs/rcppml.yml

stages:
  - id: DATA
    outputs:
      - id: rawdata_h5ad
        path: "{dataset}.h5ad"
      - id: rawdata_clusters_truth
        path: "{dataset}.clusters_truth.tsv"
      - id: rawdata_clusters_truth_num
        path: "{dataset}.clusters_truth_num.txt"
      - id: properties_info
        path: "{dataset}_properties.yaml"
    modules:
      - id: d-integration
        name: "R-based dataset downloads (integration collection)"
        software_environment: r_conda
        repository:
          url: https://github.com/omni-scrna/1-data
          commit: 4e4f1a5
        parameters:
          - dataset_name: "be1"
            batch_var: Sample
            labels_var: clusters.truth
            sample_var: Sample
          - dataset_name: "pancreas"
            batch_var: study
            labels_var: clusters.truth
            sample_var: study
      - id: d-pca
        name: "R-based dataset downloads (PCA collection)"
        software_environment: r_conda
        repository:
          url: https://github.com/omni-scrna/1-data
          commit: 4e4f1a5
        parameters:
          - dataset_name: "sc-mix"
            batch_var: null
            labels_var: cell_line
            sample_var: null
      - id: d-feat-sel
        name: "R-based dataset downloads (feature selection collection)"
        software_environment: r_conda
        repository:
          url: https://github.com/omni-scrna/1-data
          commit: 4e4f1a5
        parameters:
          - dataset_name: "be1-subset"
            batch_var: Sample
            labels_var: Sample
            sample_var: Sample
      - id: d-annotation
        name: "R-based dataset downloads (cell type annotation collection)"
        software_environment: r_conda
        repository:
          url: https://github.com/omni-scrna/1-data
          commit: 4e4f1a5
        parameters:
          - dataset_name: "cb"
            batch_var: species
            labels_var: celltype
            sample_var: species

  - id: FILT
    inputs:
      - rawdata_h5ad
      - properties_info
    outputs:
      - id: filtered_cellids
        path: "{dataset}_cellids.txt.gz"
      - id: filtered_featureids
        path: "{dataset}_featureids.txt.gz"
      - id: size_factor_tsv
        path: "{dataset}_size_factors.tsv"
    modules:
      - id: fi-scrapper
        name: "scrapper-style filtering"
        software_environment: "scrapper"
        repository:
          url: https://github.com/omni-scrna/scrapper
          commit: 64e91bb
          entrypoint: filter

  - id: NORM
    inputs:
      - rawdata_h5ad
      - filtered_cellids
      - filtered_featureids
    outputs:
      - id: normalized_h5
        path: "{dataset}_normalized.h5"
    modules:
      - id: nr-scrapper
        name: "scrapper-based normalization"
        software_environment: "scrapper"
        repository:
          url: https://github.com/omni-scrna/scrapper
          commit: f201861
          entrypoint: normalize
      - id: nr-scanpy
        name: "Python-based scRNA-seq normalization methods"
        software_environment: "py_conda"
        repository:
          url: https://github.com/omni-scrna/scanpy
          commit: b5c6855
          entrypoint: normalize
        parameters:
          - flavor: ["log1pCP10k", "analyticalPearsonResiduals"]
      - id: nr-seurat
        name: "Seurat-based scRNA-seq normalization methods"
        software_environment: "seurat"
        repository:
          url: https://github.com/omni-scrna/seurat
          commit: 984d35a
          entrypoint: normalize
        parameters:
          - flavor: ["sctransformv2"]
            random_seed: 42

  - id: FEAT
    inputs:
      - rawdata_h5ad
      - normalized_h5
      - filtered_cellids
      - filtered_featureids
      - properties_info
    outputs:
      - id: normalized_selected_h5
        path: "{dataset}_normalized_selected.h5"
    modules:
      - id: fe-seurat
        name: "seurat-based gene selection"
        software_environment: "seurat"
        exclude:
          - d-pca
        repository:
          url: https://github.com/omni-scrna/seurat
          commit: 984d35a
          entrypoint: select
        parameters:
          - selection_type: ["seurat_vst", "seurat_vst_batch"]
            number_selected: 2000
      - id: fe-scrapper
        name: "scrapper-based gene selection"
        software_environment: "scrapper"
        exclude:
          - d-pca
        repository:
          url: https://github.com/omni-scrna/scrapper
          commit: f201861
          entrypoint: select
        parameters:
          - number_selected: 2000
      - id: fe-scanpy
        name: "scanpy-based gene selection"
        software_environment: "scanpy"
        exclude:
          - d-pca
        repository:
          url: https://github.com/omni-scrna/scanpy
          commit: 2a56c14
          entrypoint: feat-select
        parameters:
          - flavor: ["pearson_residuals"]
            number_selected: 2000
          #- flavor: ["pearson_residuals", "scanpy_seurat", "scanpy_cell_ranger"]

  - id: PCA
    resources:
      cores: 4
    inputs:
      - normalized_selected_h5
    outputs:
      - id: embedding_tsv
        path: "{dataset}_embedding.tsv"
      - id: loadings_tsv
        path: "{dataset}_loadings.tsv"
    modules:
      - id: pc-scanpy
        name: "scanpy PCA"
        software_environment: "scanpy"
        exclude:
          - d-feat-sel
          - d-annotation
        repository:
          url: https://github.com/omni-scrna/scanpy
          commit: b41bf43
          entrypoint: pca
        parameters:
          - solver: [arpack]
            dense: "false"
            n_components: 50
            random_seed: 42
          - solver: [randomized]
            dense: "true"
            n_components: 50
            random_seed: 42
      - id: pc-scrapper
        name: "scrapper PCA"
        software_environment: "scrapper"
        exclude:
          - d-feat-sel
          - d-annotation
        repository:
          url: https://github.com/omni-scrna/scrapper
          commit: f201861
          entrypoint: pca
        parameters:
          - solver: [exact, irlba, random]
            n_components: 50
            random_seed: 42
      # `--solver` is pinned to the input density it is valid for:
      # rsc dispatches on density before the solver and would silently
      # substitute, so our module raises rather than mis-report. Both of these
      # are the sparse-input solvers. covariance-eigh is the exact control
      # randomized-halko is seed-sensitive.
      - id: pc-rapids
        name: "rapids-singlecell PCA (GPU)"
        software_environment: "rapids_singlecell"
        requires_capabilities: [gpu]
        exclude:
          - d-feat-sel
          - d-annotation
        repository:
          url: https://github.com/omni-scrna/rapids-singlecell
          commit: b28deb6
          entrypoint: pca
        parameters:
          - solver: [covariance-eigh, randomized-halko]
            n_components: 50
            random_seed: 42

      - id: pc-rcppml
        name: "RcppML truncated SVD (cpu)"
        software_environment: "rcppml"
        exclude:
          - d-feat-sel
          - d-annotation
        repository:
          url: https://github.com/omni-scrna/rcppml
          commit: 47a7dd4
          entrypoint: pca
        parameters:
          - solver: [lanczos, krylov]
            n_components: 50
            random_seed: 42

      # Same stage, not strictly a PCA: nmf reads and writes the same
      # with factors named PC1..PCk so the downstream metrics and validators can read
      # it unchanged.
      # But, NMF is only defined on non-negative input; needs extra excludes.
      - id: pc-rcppml-nmf
        name: "RcppML NMF (cpu)"
        software_environment: "rcppml"
        exclude:
          - d-feat-sel
          - d-annotation
          # NMF is only defined on non-negative input, 
          # That rules out the Pearson-residual normalisations:
          # nr-seurat (sctransformv2) and nr-scanpy's
          # analyticalPearsonResiduals. 
          # TODO: Split nr-scanpy's two flavors into separate module ids to get the log one.
          - nr-seurat
          - nr-scanpy
        repository:
          url: https://github.com/omni-scrna/rcppml
          commit: 47a7dd4
          entrypoint: nmf
        parameters:
          - loss: [mse]
            n_components: 50
            random_seed: 42

      # GPU variants.
      # We split so that the DAG can run on GPU-less hosts
      - id: pc-rcppml-gpu
        name: "RcppML truncated SVD (GPU)"
        software_environment: "rcppml"
        requires_capabilities: [gpu]
        exclude:
          - d-feat-sel
          - d-annotation
        repository:
          url: https://github.com/omni-scrna/rcppml
          commit: 47a7dd4
          entrypoint: pca
        parameters:
          - solver: [lanczos, krylov]
            n_components: 50
            random_seed: 42
            backend: gpu

      - id: pc-rcppml-nmf-gpu
        name: "RcppML NMF (GPU)"
        requires_capabilities: [gpu]
        software_environment: "rcppml"
        exclude:
          - d-feat-sel
          - d-annotation
          - nr-seurat
          - nr-scanpy
        repository:
          url: https://github.com/omni-scrna/rcppml
          commit: 47a7dd4
          entrypoint: nmf
        parameters:
          - loss: [mse]
            n_components: 50
            random_seed: 42
            backend: gpu

  - id: ISOMAP
    resources:
      cores: 4
    inputs:
      - normalized_selected_h5
    outputs:
      - id: embedding_tsv
        path: "{dataset}_embedding.tsv"
      - id: geodesics_h5
        path: "{dataset}_geodesics.h5"
    modules:
      - id: dr-isomap
        name: "sklearn (landmark) Isomap"
        software_environment: "sklearn"
        repository:
          url: https://github.com/omni-scrna/sklearn
          commit: 00d3afc
          entrypoint: isomap
        parameters:
          - n_neighbors: [30]
            n_components: 50
            n_landmarks: 1000
            landmark_method: min-max
            random_seed: 42

  - id: EMBED-M
    inputs:
      - embedding_tsv
      - rawdata_clusters_truth
    outputs:
      - id: embedding_metrics
        path: "{dataset}_embedding_metrics.json"
    modules:
      - id: em-metrics-r
        name: "Embedding metrics in R"
        software_environment: "metrics"
        repository:
          url: https://github.com/omni-scrna/metrics
          commit: 2b9b1a3
          entrypoint: embedding-r
      #- id: em-metrics-py
      #  name: "Embedding metrics in python"
      #  software_environment: "metrics"
      #  repository:
      #    url: https://github.com/omni-scrna/metrics
      #    commit: 2b9b1a3
      #    entrypoint: embedding-py

  - id: NNG
    inputs:
      - embedding_tsv
    outputs:
      - id: neighbors_h5
        path: "{dataset}_neighbors.h5"
    modules:
      - id: nn-scanpy
        name: "scanpy KNN graph"
        software_environment: "scanpy"
        exclude:
          - cntfct
        repository:
          url: https://github.com/omni-scrna/scanpy
          commit: b41bf43
          entrypoint: knn
        parameters:
          - n_neighbors: 15
            random_seed: 42
            flavor: "umap"
      - id: nn-rapids
        name: "rapids-singlecell KNN graph (GPU)"
        software_environment: "rapids_singlecell"
        requires_capabilities: [gpu]
        repository:
          url: https://github.com/omni-scrna/rapids-singlecell
          commit: b28deb6
          entrypoint: knn
        parameters:
          # rsc.pp.neighbors at the cuVS default
          - n_neighbors: 15
            random_seed: 42
            flavor: "rapids"

  - id: GRAPH-M
    inputs:
      - neighbors_h5
      - rawdata_clusters_truth
    outputs:
      - id: graph_metrics
        path: "{dataset}_graph_metrics.json"
    modules:
      - id: nn-metrics-r
        name: "Graph metrics in R"
        software_environment: "metrics"
        repository:
          url: https://github.com/omni-scrna/metrics
          commit: 2b9b1a3
          entrypoint: graph-r

  - id: GEOM-M
    inputs:
      - normalized_selected_h5
      - embedding_tsv
      - neighbors_h5
    outputs:
      - id: geometry_metrics
        path: "{dataset}_geometry_metrics.json"
      - id: geometry_pair_summary
        path: "{dataset}_geometry_pair_summary.tsv"
    modules:
      - id: geometry-metrics-py
        name: "Pairwise representation geometry metrics"
        software_environment: "metrics"
        repository:
          url: https://github.com/omni-scrna/metrics
          commit: 2b9b1a3
          entrypoint: geometry-py

  - id: CLUST
    inputs:
      - neighbors_h5
    outputs:
      - id: clusters_tsv
        path: "{dataset}_clusters.tsv"
    modules:
      - id: cl-scanpy
        name: "scanpy Leiden clustering"
        software_environment: "scanpy"
        repository:
          url: https://github.com/omni-scrna/scanpy
          commit: b41bf43
          entrypoint: cluster
        parameters:
          - flavor: ["igraph", "leidenalg"]
            resolution: [0.5, 1.0]
            random_seed: 42
      - id: cl-seurat
        name: "Seurat clustering"
        software_environment: "seurat"
        repository:
          url: https://github.com/omni-scrna/seurat
          commit: 537d178
          entrypoint: cluster
        parameters:
          - resolution: [0.5, 1.0]
            random_seed: 42
            flavor: ["leiden", "louvain_original"]
        #repository:
        #  url: https://github.com/omni-scrna/seurat
        #  commit: add-clustering
        #  entrypoint: clustering
        #parameters:
        #  - modularity_algorithm: ["louvain_original"]
        #    resolution: [0.5, 1.0]
        #    random_seed: 42
        #  #- modularity_algorithm: ["louvain_original", "louvain_multilevel_refinement", "slm", "leiden"]
      - id: cl-scrapper
        name: "Scrapper clustering"
        software_environment: "scrapper"
        repository:
          url: https://github.com/omni-scrna/scrapper
          commit: 8a1cfd8
          entrypoint: cluster
        parameters:
          - flavor: ["leiden_modularity", "leiden_cpm", "multilevel", "walktrap"]
            resolution: [0.5, 1.0]
            walktrap_steps: [2, 4]
            random_seed: 42
      - id: cl-rapids
        name: "rapids-singlecell graph clustering (GPU)"
        software_environment: "rapids_singlecell"
        requires_capabilities: [gpu]
        repository:
          url: https://github.com/omni-scrna/rapids-singlecell
          commit: b28deb6
          entrypoint: cluster
        parameters:
          - method: "rapids-leiden"
            resolution: [0.5, 1.0]
            random_seed: 42
          # rsc louvain has no seed parameter
          - method: "rapids-louvain"
            resolution: [0.5, 1.0]

  - id: CLUST-M
    inputs:
      - clusters_tsv
      - rawdata_clusters_truth
    outputs:
      - id: cluster_metrics
        path: "{dataset}_cluster_metrics.json"
    modules:
      - id: cl-metrics-r
        name: "Partition metrics in R"
        software_environment: "metrics"
        repository:
          url: https://github.com/omni-scrna/metrics
          commit: 2b9b1a3
          entrypoint: cluster-r

  - id: INTG8
    inputs:
      - embedding_tsv
      - loadings_tsv
      - normalized_selected_h5
      - rawdata_h5ad
      - properties_info
    outputs:
      - id: corrected_tsv
        path: "{dataset}_corrected.tsv"
    modules:
      - id: in-harmony
        name: "Harmony batch correction"
        software_environment: "integrate"
        exclude:
          - cntfct
          - d-pca
          - d-annotation
          - d-feat-sel
        repository:
          url: https://github.com/omni-scrna/7-integrate
          commit: 52c6c64
          entrypoint: harmony-r
        parameters:
          - theta: [0.1, 2]
      - id: in-seurat
        name: "Seurat IntegrateLayers batch correction"
        software_environment: "seurat"
        exclude:
          - d-pca
          - d-annotation
          - d-feat-sel
          - cntfct
        repository:
          url: https://github.com/omni-scrna/seurat
          commit: db6c6ba
          entrypoint: integrate
        parameters:
          - method: [rpca]
            k_anchor: [5, 20]
      - id: in-scanorama
        name: "Scanorama batch correction"
        software_environment: "integrate-py"
        exclude:
          - d-pca
          - d-annotation
          - d-feat-sel
          - cntfct
        repository:
          url: https://github.com/omni-scrna/7-integrate-py
          commit: e005eb5
          entrypoint: scanorama
        parameters:
          - knn: [20]
            sigma: [15]

  - id: INTG8-M
    inputs:
      - corrected_tsv
      - rawdata_clusters_truth
      - rawdata_h5ad
      - properties_info
      - embedding_tsv
      - clusters_corrected_tsv
    outputs:
      - id: integration_metrics
        path: "{dataset}_integration_metrics.json"
    modules:
      - id: in-metrics-r
        name: "Integration metrics in R"
        software_environment: "metrics"
        repository:
          url: https://github.com/omni-scrna/metrics
          commit: 2b9b1a3
          entrypoint: integration-r
        parameters:
          - k: 20 # knn size for CellMixS cms/entropy/isi (evalIntegration)
            n_dim: 10 # corrected-embedding dims used as the CellMixS subspace
            cell_min: 10 # min cells per batch for cms's Anderson-Darling test
            ldf_k: 75 # knn size for CellMixS ldfDiff (matches ldfDiff's own default)
            ldf_n_dim: 20 # pre/post dims used for ldfDiff's LDF subspace (matches ldfDiff's own default)
      - id: in-metrics-py
        name: "Integration metrics in python (scib-metrics + sklearn)"
        software_environment: "metrics"
        repository:
          url: https://github.com/omni-scrna/metrics
          commit: 2b9b1a3
          entrypoint: integration-py
        parameters:
          - n_neighbors: 90 # knn graph size for clisi_knn (pynndescent)
            random_state: 0 # random seed for the pynndescent approximate KNN search

  - id: NNG-C
    inputs:
      - corrected_tsv
    outputs:
      - id: neighbors_corrected_h5
        path: "{dataset}_neighbors.h5"
    modules:
      - id: nn-scanpy-c
        name: "scanpy KNN graph (corrected embedding)"
        software_environment: "scanpy"
        repository:
          url: https://github.com/omni-scrna/scanpy
          commit: b41bf43
          entrypoint: knn
        parameters:
          - n_neighbors: 15
            random_seed: 42
            flavor: "umap"

  - id: CLUST-C
    inputs:
      - neighbors_corrected_h5
    outputs:
      - id: clusters_corrected_tsv
        path: "{dataset}_clusters.tsv"
    modules:
      - id: cl-scanpy-c
        name: "scanpy Leiden clustering (corrected embedding)"
        software_environment: "scanpy"
        repository:
          url: https://github.com/omni-scrna/scanpy
          commit: b41bf43
          entrypoint: cluster
        parameters:
          - flavor: ["igraph", "leidenalg"]
            resolution: [0.5, 1.0]
            random_seed: 42

  - id: CLUST-E
    inputs:
      - embedding_tsv
    outputs:
      - id: clusters_embedding_tsv
        path: "{dataset}_clusters.tsv"
    modules:
      - id: cluster-optics
        name: "scikit-learn OPTICS clustering"
        software_environment: "py_conda"
        repository:
          url: https://github.com/omni-scrna/clustering-py
          commit: 8b6a00a
          entrypoint: cluster
        parameters:
          - min_samples: [10, 30, 50]
            algorithm: ["ball_tree", "kd_tree", "brute"]
            metric: ["euclidean", "manhattan"]
            cluster_method: "xi"
            xi: 0.05
            random_seed: 42
          - min_samples: [10, 30, 50]
            algorithm: "brute"
            metric: "cosine"
            cluster_method: "xi"
            xi: 0.05
            random_seed: 42
      - id: cl-rapids-embed
        name: "rapids-singlecell embedding clustering (GPU)"
        software_environment: "rapids_singlecell"
        requires_capabilities: [gpu]
        repository:
          url: https://github.com/omni-scrna/rapids-singlecell
          commit: b28deb6
          entrypoint: cluster_embedding
        parameters:
          - method: "rapids-kmeans"
            n_clusters: [10, 20]
            random_seed: 42
          # hdbscan and dbscan have no seed parameter; 
          # Both emit -1 for noise points, which CLUST-M has to handle.
          - method: "rapids-hdbscan"
            min_samples: [10, 30]
            min_cluster_size: 25
          # eps is an absolute distance in PCA space, so it does not transfer
          # across datasets or n_components. Measured on be1 (50 PCs): kNN
          # distances run 4.2-35.6, median 11.8 -- eps 0.5/1.0 was below the
          # closest pair in the data and labelled every cell noise.
          - method: "rapids-dbscan"
            eps: [10, 14]
            min_samples: [10, 30]

  - id: ANNO
    inputs:
      - normalized_selected_h5
    outputs:
      - id: annotations_tsv
        path: "{dataset}_annotations.tsv"
    modules:
      - id: an-singler
        name: singler annotation
        software_environment: annotate
        repository:
          url: https://github.com/omni-scrna/9-annotate
          commit: 439981c
        parameters:
          - reference: ["HumanPrimaryCellAtlasData", "BlueprintEncodeData"]

  - id: ANNO-M
    inputs:
      - annotations_tsv
      - rawdata_clusters_truth
    outputs:
      - id: annotation_metrics
        path: "{dataset}_annotation_metrics.json"
    modules:
      - id: an-metrics-r
        name: "Annotation metrics in R"
        software_environment: "metrics"
        repository:
          url: https://github.com/omni-scrna/metrics
          commit: 4cfb831
          entrypoint: annotation-r

  - id: CNTFCT
    resources:
      cores: 4
    inputs:
      - normalized_selected_h5
      - rawdata_h5ad
      - filtered_cellids
    outputs:
      - id: embedding_tsv
        path: "{dataset}_embedding.tsv"
      - id: loadings_tsv
        path: "{dataset}_loadings.tsv"
    modules:
      - id: cntfct
        name: count-factor
        software_environment: count-factor
        repository:
          url: https://github.com/omni-scrna/count-factor
          commit: ec9badb
        parameters:
          - factorization_type: ["newwave", "scgbm", "glmpca"]
            n_dim: 4
            random_seed: 42

  - id: NORM-M
    inputs:
      - embedding_tsv
      - size_factor_tsv
    outputs:
      - id: normalization_metrics
        path: "{dataset}_normalization_metrics.json"
    modules:
      - id: nm-metrics-r
        name: "Normalization metrics in R"
        software_environment: "metrics"
        repository:
          url: https://github.com/omni-scrna/metrics
          commit: 2b9b1a3
          entrypoint: normalization-r
