# CI fixture run: the be1 fixture (ci/fixture-plan.sh), first combo per module,
# DATA..PCA + PCA_M/REPORT, CPU arms only (--filter skips capability pruning, so GPU arms are
# left out by name). Usage, after ci/fixture-plan.sh > benchmark_ci.yaml:
#   ob run benchmark_ci.yaml --filter filters/ci-until-pca.yaml
picks:
  DATA: {be1: all}
  FILT: {'*': first}
  NORM: {'*': first}
  FEAT: {'*': first}
  PCA:
    pc_exact: first
    pc_scanpy: first
    pc_scrapper: first
    pc_rcppml: first
    pc_rcppml_nmf: first
  # PCA metrics gathers: a filter that cuts every producer of a gathered id
  # fails the DAG (REPORT has nothing to gather) instead of pruning it.
  PCA_M: {'*': all}
  REPORT: {'*': all}
