# Slice: one small dataset (be1, from d_integration), every module (first parameter combo) up to and including PCA.
# Usage: ob run benchmark_conda.yaml --filter filters/until-pca.yaml
# 44d965bf = d_integration's be1 combo; it changes if that parameter set changes.
picks:
  DATA: {d_integration: ["44d965bf"]}
  FILT: {'*': first}
  NORM: {'*': first}
  FEAT: {'*': first}
  PCA:  {'*': first}
  PCA_M: {'*': all}   # gathers must keep a producer or the DAG fails
  REPORT: {'*': all}
