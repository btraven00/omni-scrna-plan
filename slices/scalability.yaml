name: cost-scalability
id: cost_scalability
description: >
  Cost ladder. Four rungs of the TENx ladder through PCA -> NNG -> CLUST, to fit
  log(cost) ~ log(n_cells) per pipeline per resource. The slope should be
  characteristic of the algorithm; the intercept is machine-dependent, so only
  the slope travels between boxes and only the pair predicts a cost at a target
  size.

  This ladder has NO cell-type labels -- the truth files are emitted header-only
  on purpose (verified: 0 rows, k=0) -- so every accuracy metric is invalid here
  and the slice stops at CLUST. Accuracy and stability come from the labelled
  slice; the two join on (PCA_module, NNG_module, CLUST_module), which is why
  the module commits must match across both or the attribution is fiction.

  RUN SERIALLY (--cores 1) ON AN OTHERWISE IDLE MACHINE. Contended timings are
  what the accuracy sweeps produced and they are not fit for a cost claim.
benchmarker: "Ben <ben.uzh@proton.me>"

version: "0.1.0"
api_version: "0.4.0"

software_backend: "conda"

software_environments:
  omni_data:
    name: omni-data fixture loader
    conda: ../envs/omni-data-pinned.yml
  py_conda:
    name: Python conda env
    conda: ../envs/py.yml
  scanpy:
    name: scanpy multi-module
    conda: ../envs/scanpy.yml
  scrapper:
    name: scrapper multi-module
    conda: ../envs/scrapper.yml
  seurat:
    name: Seurat multi-module
    conda: ../envs/seurat.yml
  rapids_singlecell:
    name: rapids-singlecell GPU env (needs an NVIDIA GPU)
    conda: ../envs/rapids-singlecell.yml

ladder: &ladder
  software_environment: omni_data
  repository:
    url: https://github.com/btraven00/omni-data
    commit: 80611e83d13c8bd0d15fbc033c6a5e1a7900a0b8

stages:
  # Four rungs, x2 per step: 8x span is enough to fit a slope and cheap enough
  # to rerun when the fit looks wrong. Each rung is a strict subset of the next,
  # so a change along the curve is "more cells", not "different cells".
  - id: DATA
    outputs:
      - id: rawdata_h5ad
        path: "{dataset}.h5ad"
      - id: rawdata_clusters_truth
        path: "{dataset}.clusters_truth.tsv"
      - id: rawdata_clusters_truth_num
        path: "{dataset}.clusters_truth_num.txt"
      - id: properties_info
        path: "{dataset}_properties.yaml"
    modules:
      - id: tenx-0005k
        name: "TENx ladder: 5k cells"
        <<: *ladder
        parameters:
          - uri: file:///home/b/phd/data/tenx_ladder/tenx-0005k/
            uri_type: directory
      - id: tenx-0010k
        name: "TENx ladder: 10k cells"
        <<: *ladder
        parameters:
          - uri: file:///home/b/phd/data/tenx_ladder/tenx-0010k/
            uri_type: directory
      - id: tenx-0020k
        name: "TENx ladder: 20k cells"
        <<: *ladder
        parameters:
          - uri: file:///home/b/phd/data/tenx_ladder/tenx-0020k/
            uri_type: directory

  - id: FILT
    inputs:
      - rawdata_h5ad
      - properties_info
    outputs:
      - id: filtered_cellids
        path: "{dataset}_cellids.txt.gz"
      - id: filtered_featureids
        path: "{dataset}_featureids.txt.gz"
      - id: size_factor_tsv
        path: "{dataset}_size_factors.tsv"
    modules:
      - id: fi-scrapper
        name: "scrapper-style filtering"
        software_environment: "scrapper"
        repository:
          url: https://github.com/omni-scrna/scrapper
          commit: f201861
          entrypoint: filter

  - id: NORM
    inputs:
      - rawdata_h5ad
      - filtered_cellids
      - filtered_featureids
    outputs:
      - id: normalized_h5
        path: "{dataset}_normalized.h5"
    modules:
      - id: nr-scanpy
        name: "Python-based scRNA-seq normalization methods"
        software_environment: "py_conda"
        repository:
          url: https://github.com/omni-scrna/scanpy
          commit: b5c6855
          entrypoint: normalize
        parameters:
          - flavor: ["log1pCP10k"]

  - id: FEAT
    inputs:
      - rawdata_h5ad
      - normalized_h5
      - filtered_cellids
      - filtered_featureids
      - properties_info
    outputs:
      - id: normalized_selected_h5
        path: "{dataset}_normalized_selected.h5"
    modules:
      - id: fe-scanpy
        name: "scanpy-based gene selection"
        software_environment: "scanpy"
        repository:
          url: https://github.com/omni-scrna/scanpy
          commit: 2a56c14
          entrypoint: feat-select
        parameters:
          # scanpy_seurat, not pearson_residuals: the latter is ~n^2.2 in memory
          # (1.9GB at 4.5k cells, 17.2GB at 12.1k) and would dominate the fit
          # with a stage that is not under test.
          - flavor: ["scanpy_seurat"]
            number_selected: 2000

  # --------------------------------------------------------------------------
  # The measured path. One arm per stage where the stage is not under test, so
  # the fit attributes cost to the thing that varies.
  # --------------------------------------------------------------------------
  - id: PCA
    resources:
      # One job at a time, 8 threads each: `cores: 8` makes snakemake reserve
      # all 8 for the rule, so nothing else runs beside it, and it exports
      # OMP_NUM_THREADS=8 which is what the modules without an explicit knob
      # inherit. Run the whole slice with --cores 8.
      cores: 8
    inputs:
      - normalized_selected_h5
    outputs:
      - id: embedding_tsv
        path: "{dataset}_embedding.tsv"
      - id: loadings_tsv
        path: "{dataset}_loadings.tsv"
    modules:
      - id: pc-scanpy
        name: "scanpy PCA"
        software_environment: "scanpy"
        repository:
          url: /home/b/lab/omni-scrna/split-stages-plan-modules/scanpy
          commit: 37a3178
          entrypoint: pca
        parameters:
          - solver: arpack
            dense: "false"
            blas_threads: 8
            n_components: 50
            random_seed: 1

      # Second PCA arm, different language. Needed for the hypothesis under
      # test: with one curve there is nothing to compare, and "slopes are
      # characteristic of the algorithm, intercepts of the machine" is only
      # testable across implementations. Local checkout: this commit is the
      # out-of-core base + obkit phases + the cherry-picked _embedding.tsv
      # rename, which exists on no remote branch yet. Needs --dirty.
      - id: pc-scrapper
        name: "scrapper PCA (libscran irlba)"
        software_environment: "scrapper"
        repository:
          url: /home/b/lab/omni-scrna/split-stages-plan-modules/scrapper
          commit: 4f14524
          entrypoint: pca
        parameters:
          - solver: irlba
            backend: memory        # matched to scanpy/rapids: no DelayedArray
            dense: "false"
            num_threads: 8
            n_components: 50
            random_seed: 1

      - id: pc-rapids
        name: "rapids-singlecell PCA (GPU)"
        software_environment: rapids_singlecell
        requires_capabilities: [gpu]
        repository:
          url: https://github.com/omni-scrna/rapids-singlecell
          commit: b28deb6756ad4ef7df0842422729547e1762aebb
          entrypoint: pca
        parameters:
          # lanczos: the Krylov arm, matching scanpy arpack and scrapper irlba by
          # algorithm family so the slopes compare like with like. Its
          # gpu_upload/gpu_download phases are charged to COMPUTE, not I/O --
          # PCIe transfer is part of using the GPU, and bucketing it with disk
          # reads would let this arm look cheaper on compute than it is.
          - solver: lanczos
            n_components: 50
            random_seed: 1

  - id: NNG
    resources:
      # One job at a time, 8 threads each: `cores: 8` makes snakemake reserve
      # all 8 for the rule, so nothing else runs beside it, and it exports
      # OMP_NUM_THREADS=8 which is what the modules without an explicit knob
      # inherit. Run the whole slice with --cores 8.
      cores: 8
    inputs:
      - embedding_tsv
    outputs:
      - id: neighbors_h5
        path: "{dataset}_neighbors.h5"
    modules:
      - id: nn-scanpy
        name: "scanpy KNN graph"
        software_environment: "scanpy"
        repository:
          url: /home/b/lab/omni-scrna/split-stages-plan-modules/scanpy
          commit: 37a3178
          entrypoint: knn
        parameters:
          - n_neighbors: 15
            flavor: "umap"
            random_seed: 1

  # Three clusterers, three languages. One resolution: cost depends on it only
  # through the cluster count, and holding it fixed keeps the fit about n.
      - id: nn-rapids
        name: "rapids-singlecell KNN graph (GPU)"
        software_environment: rapids_singlecell
        requires_capabilities: [gpu]
        repository:
          url: https://github.com/omni-scrna/rapids-singlecell
          commit: b28deb6756ad4ef7df0842422729547e1762aebb
          entrypoint: knn
        parameters:
          - n_neighbors: 15
            flavor: rapids
            random_seed: 1

  - id: CLUST
    resources:
      # One job at a time, 8 threads each: `cores: 8` makes snakemake reserve
      # all 8 for the rule, so nothing else runs beside it, and it exports
      # OMP_NUM_THREADS=8 which is what the modules without an explicit knob
      # inherit. Run the whole slice with --cores 8.
      cores: 8
    inputs:
      - neighbors_h5
    outputs:
      - id: clusters_tsv
        path: "{dataset}_clusters.tsv"
    modules:
      - id: cl-scanpy
        name: "scanpy Leiden clustering"
        software_environment: "scanpy"
        repository:
          url: /home/b/lab/omni-scrna/split-stages-plan-modules/scanpy
          commit: 37a3178
          entrypoint: cluster
        parameters:
          - flavor: igraph
            resolution: 0.2
            random_seed: 1
      - id: cl-scrapper
        name: "scrapper clustering"
        software_environment: "scrapper"
        repository:
          url: /home/b/lab/omni-scrna/split-stages-plan-modules/scrapper
          commit: 4f14524
          entrypoint: cluster
        parameters:
          - flavor: leiden_modularity
            resolution: 0.2
            walktrap_steps: 4
            random_seed: 1
      - id: cl-seurat
        name: "Seurat clustering"
        software_environment: "seurat"
        repository:
          url: /home/b/lab/omni-scrna/split-stages-plan-modules/seurat
          commit: 31ab2cf
          entrypoint: cluster
        parameters:
          - flavor: leiden
            resolution: 0.2
            random_seed: 1
      - id: cl-rapids
        name: "rapids-singlecell graph clustering (GPU)"
        software_environment: rapids_singlecell
        requires_capabilities: [gpu]
        repository:
          url: https://github.com/omni-scrna/rapids-singlecell
          commit: b28deb6756ad4ef7df0842422729547e1762aebb
          entrypoint: cluster
        parameters:
          - method: rapids-leiden
            resolution: 0.2
            random_seed: 1
