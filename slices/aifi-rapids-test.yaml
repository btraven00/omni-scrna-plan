# FEASIBILITY TEST, not a results plan.
#
# One path end to end on ~151k cells, to answer three questions the 12k-55k runs
# cannot: does the GPU arm fit in VRAM, what are the real host peaks, and where
# does the wall time actually go once the datasets are big enough for the
# scaling slopes to stop being ~0.
#
# It is NOT the rapids-vs-CPU comparison. That needs the CPU arms at the same n;
# a rapids-only run can only say "it ran". Deliberately one seed and one
# resolution -- nothing here is a measurement of accuracy or stability.
#
# Every module id, commit and parameter below is copied verbatim from
# slices/clustering.yaml so the timings are comparable to the existing runs.
# NNG stays nn-scanpy for that reason, even though a rapids kNN exists.
#
# The DATA uri is a CLUSTER path (built by build_aifi_omnidata.py) and the
# metrics url is rewritten on sync; this slice is not runnable as-is on a laptop.
name: aifi-rapids-test
id: aifi_rapids_test
description: "151k-cell feasibility test, rapids PCA + rapids Leiden, single path"
benchmarker: "Mark Robinson <mark.robinson@mls.uzh.ch>"
version: "0.0.1"
api_version: "0.4.0"
software_backend: "conda"

software_environments:
  omni_data:
    name: omni-data fixture loader
    conda: ../envs/omni-data-pinned.yml
  py_conda:
    name: Python conda env
    conda: ../envs/py.yml
  scanpy:
    name: scanpy multi-module
    conda: ../envs/scanpy.yml
  scrapper:
    name: scrapper multi-module
    conda: ../envs/scrapper.yml
  metrics:
    name: metrics env
    conda: ../envs/metrics.yaml
  rapids_singlecell:
    name: rapids-singlecell (GPU)
    conda: ../envs/rapids-singlecell.yml

stages:
  - id: DATA
    outputs:
      - id: rawdata_h5ad
        path: "{dataset}.h5ad"
      - id: rawdata_clusters_truth
        path: "{dataset}.clusters_truth.tsv"
      - id: rawdata_clusters_truth_num
        path: "{dataset}.clusters_truth_num.txt"
      - id: properties_info
        path: "{dataset}_properties.yaml"
    modules:
      - id: aifi-d1
        name: "AIFI immune atlas, donor BR1010, AIFI_L2 labels"
        software_environment: omni_data
        repository:
          url: https://github.com/btraven00/omni-data
          commit: 80611e83d13c8bd0d15fbc033c6a5e1a7900a0b8
        parameters:
          - uri: file:///home/ben/oracles/data/aifi_omnidata/aifi-d1/
            uri_type: directory

  - id: FILT
    resources:
      cores: 24
    inputs:
      - rawdata_h5ad
      - properties_info
    outputs:
      - id: filtered_cellids
        path: "{dataset}_cellids.txt.gz"
      - id: filtered_featureids
        path: "{dataset}_featureids.txt.gz"
      - id: size_factor_tsv
        path: "{dataset}_size_factors.tsv"
    modules:
      - id: fi-scrapper
        name: "scrapper-style filtering"
        software_environment: "scrapper"
        repository:
          url: https://github.com/omni-scrna/scrapper
          commit: f201861
          entrypoint: filter

  - id: NORM
    resources:
      cores: 32
    inputs:
      - rawdata_h5ad
      - filtered_cellids
      - filtered_featureids
    outputs:
      - id: normalized_h5
        path: "{dataset}_normalized.h5"
    modules:
      - id: nr-scanpy
        name: "Python-based scRNA-seq normalization methods"
        software_environment: "py_conda"
        repository:
          url: https://github.com/omni-scrna/scanpy
          commit: b5c6855
          entrypoint: normalize
        parameters:
          - flavor: ["log1pCP10k"]

  - id: FEAT
    resources:
      cores: 16
    inputs:
      - rawdata_h5ad
      - normalized_h5
      - filtered_cellids
      - filtered_featureids
      - properties_info
    outputs:
      - id: normalized_selected_h5
        path: "{dataset}_normalized_selected.h5"
    modules:
      - id: fe-scanpy
        name: "scanpy-based gene selection"
        software_environment: "scanpy"
        repository:
          url: https://github.com/omni-scrna/scanpy
          commit: 2a56c14
          entrypoint: feat-select
        parameters:
          - flavor: ["scanpy_seurat"]
            number_selected: 2000

  - id: PCA
    resources:
      cores: 8
    inputs:
      - normalized_selected_h5
    outputs:
      - id: embedding_tsv
        path: "{dataset}_embedding.tsv"
      - id: loadings_tsv
        path: "{dataset}_loadings.tsv"
    modules:
      # covariance-eigh: deterministic gram+eigh, no seed axis by construction.
      # This is the VRAM question: 151k x 2000 dense is 1.21 GB float32 and the
      # L4 has 23 GB, so it should be comfortable -- but measured, not assumed.
      - id: pc-rapids
        name: "rapids-singlecell PCA (GPU, exact)"
        software_environment: rapids_singlecell
        requires_capabilities: [gpu]
        repository:
          url: https://github.com/omni-scrna/rapids-singlecell
          commit: b28deb6756ad4ef7df0842422729547e1762aebb
          entrypoint: pca
        parameters:
          - solver: covariance-eigh
            n_components: 50
            random_seed: 1

  - id: NNG
    resources:
      cores: 16
    inputs:
      - embedding_tsv
    outputs:
      - id: neighbors_h5
        path: "{dataset}_neighbors.h5"
    modules:
      # nn-scanpy, NOT a rapids kNN: keeping the graph builder identical to the
      # existing runs is what makes these timings comparable to them.
      - id: nn-scanpy
        name: "scanpy KNN graph"
        software_environment: "scanpy"
        repository:
          url: https://github.com/omni-scrna/scanpy
          commit: b41bf43
          entrypoint: knn
        parameters:
          - n_neighbors: 15
            flavor: "umap"
            random_seed: 42

  - id: CLUST
    resources:
      cores: 8
    inputs:
      - neighbors_h5
    outputs:
      - id: clusters_tsv
        path: "{dataset}_clusters.tsv"
    modules:
      - id: cl-rapids
        name: "rapids-singlecell graph clustering (GPU)"
        software_environment: rapids_singlecell
        requires_capabilities: [gpu]
        repository:
          url: https://github.com/omni-scrna/rapids-singlecell
          commit: b28deb6756ad4ef7df0842422729547e1762aebb
          entrypoint: cluster
        parameters:
          - method: rapids-leiden
            resolution: 0.2
            random_seed: 1

  - id: CLUST-M
    resources:
      cores: 1
    inputs:
      - clusters_tsv
      - rawdata_clusters_truth
    outputs:
      - id: cluster_metrics
        path: "{dataset}_cluster_metrics.json"
    modules:
      - id: cl-metrics-r
        name: "Partition metrics in R"
        software_environment: "metrics"
        repository:
          url: /home/b/lab/omni-scrna/split-stages-plan-modules/metrics
          commit: bc998fb
          entrypoint: cluster-r
