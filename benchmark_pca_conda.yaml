name: split-stages-plan
id: split_stages_plan
description: This benchmark lays out stages for each step of an scRNA-seq pipeline
benchmarker: "Mark Robinson <mark.robinson@mls.uzh.ch>"

# Benchmark configuration
version: "0.1.0"
# TODO: bump to api 0.7.0
api_version: "0.4.0"

provenance:
  canonical_url: https://raw.githubusercontent.com/omni-scrna/split-stages-plan/refs/heads/main/benchmark_conda.yaml

# The default software environment for this benchmark.
# One of: apptainer, conda, envmodules.
software_backend: "conda"

# Available software environments
software_environments:
  r_conda:
    name: R conda env (some packages self built)
    conda: envs/r.yml
  scanpy:
    name: scanpy multi-module
    conda: envs/scanpy.yml
  scrapper:
    name: scrapper multi-module
    conda: envs/scrapper.yml
  seurat:
    name: seurat multi-module
    conda: envs/seurat.yml
  metrics:
    name: metrics env
    conda: envs/metrics.yaml
  py_conda:
    name: Python conda env
    conda: envs/py.yml
  integrate:
    name: integration env
    conda: envs/integrate.yml
  annotate:
    name: annotate env
    conda: envs/annotate.yml
  integrate-py:
    name: integration env
    conda: envs/integrate-py.yml
  scshc:
    name: scSHC cluster significance env
    conda: envs/scshc.yml
  omni_data:
    name: omni-data fixture loader
    conda: envs/omni-data.yml
  onlinepca_jl:
    name: OnlinePCA.jl module env (julia + HDF5)
    conda: envs/onlinepca-jl.yml
  rapids_singlecell:
    name: rapids-singlecell GPU env (cu13 wheels; needs an NVIDIA GPU + CUDA 13 driver)
    conda: envs/rapids-singlecell.yml
  tpca:
    name: Topological PCA module env (numpy/scipy/h5py only)
    conda: envs/tpca.yml
  rmt_spca:
    name: RMT sparse PCA env (numpy/scipy/h5py + rust; the module builds its shim)
    conda: envs/rmt-spca.yml


# Seed sweep, referenced as *seeds by every embedding producer (PCA and
# CNTFCT) so their spread is comparable. NNG and CLUST stay pinned at 42, which
# keeps this isolating the embedding rather than the whole pipeline.
# Not a schema key -- omnibenchmark ignores it, it exists to hold the anchor.
seeds: &seeds [42, 43, 44, 45, 46]

# Component budget, referenced as *n_comps by every embedding producer. It is a
# swept axis rather than a constant because 50 is not neutral ground: tPCA takes
# the k SMALLEST eigenvectors, so its quality is a function of k in a way the
# SVD-based modules' is not. Measured on be1 (silhouette vs truth):
#
#            k=10    k=15    k=20    k=50
#   tpca     0.492   0.246   0.127  -0.012
#   scanpy   0.392   0.349   0.327   0.265
#
# At 10 tPCA wins, by 15 it has lost, at 50 it has no signal left. Pinning a
# single k picks a winner before the benchmark runs. 10 is deliberately NOT
# be1's truth count (8): sizing k from the labels is leakage, since truth is
# not an input to the PCA stage.
# Not a schema key -- omnibenchmark ignores it, it exists to hold the anchor.
n_comps: &n_comps [10, 50]

stages:
  - id: DATA
    outputs:
      - id: rawdata_h5ad
        path: "{dataset}.h5ad"
      - id: rawdata_clusters_truth
        path: "{dataset}.clusters_truth.tsv"
      - id: rawdata_clusters_truth_num
        path: "{dataset}.clusters_truth_num.txt"
      - id: properties_info
        path: "{dataset}_properties.yaml"
    modules:
      # The module id IS {dataset}: api 0.4 passes it as --name, and the stage's
      # outputs are "{dataset}.h5ad" etc. omni-data copies a multi-file download
      # under its own basenames, so this id must match the stem the files are
      # published with (be1.h5ad, be1_properties.yaml, ...). Renaming it to
      # be1-test made every output miss.
      - id: be1-fixture
        name: "be1 fixture via omni-data"
        software_environment: omni_data
        repository:
          url: https://github.com/btraven00/omni-data
          # 80611e8 (merge of omni-data#1) is the first commit that understands
          # --uri_type
          commit: 80611e83d13c8bd0d15fbc033c6a5e1a7900a0b8
        parameters:
          # Same fixture as fixtures/DATA
          #
          # uri_type states the folder outright instead of leaning on the
          # trailing slash: lose that slash in an edit and the fetch silently
          # returns the server's index page as if it were the dataset.
          - uri: https://omnibenchmark.mls.uzh.ch/datasets/be1-fixture/
            uri_type: directory

      - id: d-pca
        name: "R-based dataset downloads (PCA collection)"
        software_environment: r_conda
        repository:
          url: https://github.com/omni-scrna/1-data
          commit: 14c5ddd
        parameters:
          - dataset_name: "sc-mix"
            batch_var: null
            labels_var: cell_line
            sample_var: null

      # Commented out for e2e runs on the fixture: full pbmc is 157k cells and
      # every downstream stage pays for it (PCA alone peaks ~13GB per job).
      # Uncomment for a real benchmark run -- and comment out pc-tpca when you
      # do: it refuses >5000 cells and exits nonzero, which fails the whole run.
      # Upstream's tPCA filtration is n_cells^2 dense (197GB per intermediate at
      # 157k, ~3.6TB peak extrapolated from measurement), so THAT module is
      # fixture-only by construction. pc-tpca-fast is the one to keep here: same
      # embedding, O(n) memory, ~11GB extrapolated at 157k.
      # - id: pbmc
      #   name: "pbmc multimodal (SCT counts) via omni-data file://"
      #   software_environment: omni_data
      #   repository:
      #     url: https://github.com/btraven00/omni-data
      #     commit: eb4d368b5e83b26389e6047dd8bad6badede78f8
      #   parameters:
      #     # TODO: publish URL
      #     - uri: file:///home/b/phd/data/pbmc_omnidata
  - id: FILT
    inputs:
      - rawdata_h5ad
      - properties_info
    outputs:
      - id: filtered_cellids
        path: "{dataset}_cellids.txt.gz"
    modules:
      - id: fi-scrapper
        name: "scrapper-style filtering"
        software_environment: "scrapper"
        repository:
          url: https://github.com/omni-scrna/scrapper
          commit: 18843a7
          entrypoint: filter

  - id: NORM
    inputs:
      - rawdata_h5ad
      - filtered_cellids
    outputs:
      - id: normalized_h5
        path: "{dataset}_normalized.h5"
    modules:
      - id: nr-scrapper
        name: "scrapper-based normalization"
        software_environment: "scrapper"
        repository:
          url: https://github.com/omni-scrna/scrapper
          commit: 18843a7
          entrypoint: normalize

  - id: FEAT
    inputs:
      - rawdata_h5ad
      - normalized_h5
      - filtered_cellids
      - properties_info
    outputs:
      - id: normalized_selected_h5
        path: "{dataset}_normalized_selected.h5"
    modules:
      - id: fe-scrapper
        name: "scrapper-based gene selection"
        software_environment: "scrapper"
        repository:
          url: https://github.com/omni-scrna/scrapper
          commit: 18843a7
          entrypoint: select
        parameters:
          - number_selected: 2000

  - id: PCA
    resources:
      # cores: 8 == --cores, so only one PCA runs at a time. Each full-pbmc PCA
      # peaks ~13GB; two concurrent OOM'd a 62GB box. ponytail: raise if you cap
      # peak mem another way (mem_mb resource) or trim the solver sweep.
      cores: 8
    inputs:
      - normalized_selected_h5
    outputs:
      - id: pcas_tsv
        path: "{dataset}_pcas.tsv"
      - id: loadings_tsv
        path: "{dataset}_loadings.tsv"
    modules:
      - id: pc-scanpy-exact
        name: "scanpy PCA (seed-invariant solvers)"
        software_environment: "scanpy"
        repository:
          url: https://github.com/omni-scrna/scanpy
          commit: 53eb292
          entrypoint: pca
        parameters:
          # `randomized` is DROPPED, not merely seed-pinned: scanpy silently
          # coerces it to arpack because sklearn's PCA rejects randomized on
          # SPARSE input, and normalized_selected_h5 loads as CSR. Verified from
          # the module itself:
          #   UserWarning: Ignoring svd_solver='randomized' and using arpack,
          #   sklearn.decomposition._pca.PCA (with sparse input) only supports
          #   dict_keys(['arpack', 'covariance_eigh'])
          # so the randomized arm was a byte-identical duplicate of arpack.
          #
          # The seed IS wired correctly (random_state=args.random_seed reaches
          # sklearn); its effect is just ~2.6e-13, i.e. ARPACK convergence noise,
          # which is why the emitted TSVs are byte-identical. covariance_eigh --
          # the only other solver sklearn allows here -- agrees with arpack to
          # 8e-13, so scanpy's solver axis is degenerate on sparse input and one
          # arm is the honest representation of it.
          #
          # To get a REAL randomized SVD from scanpy the module would have to
          # densify the input, which is a module change, not a plan change.
          - solver: [arpack]
            n_components: *n_comps
            random_seed: 42
      - id: pc-scrapper
        name: "scrapper PCA"
        software_environment: "scrapper"
        repository:
          url: https://github.com/omni-scrna/scrapper
          # branch (needs --unpinned): passes random_seed through to IRLBA's
          # starting vector, which runPca otherwise seeds internally with its
          # own default of 5489 -- so the swept seed was inert here.
          # Only this module moves off 18843a7; the other four scrapper
          # entrypoints stay pinned, keeping the seed fix the single variable.
          commit: random-seed
          entrypoint: pca
        parameters:
          # `random` was measured seed-responsive at 18843a7; `irlba` was NOT,
          # because runPca seeded it internally with 5489 -- which is exactly
          # what the random-seed branch above fixes, so irlba belongs in the
          # sweep from that commit on. `exact` has no random start at all and
          # lives in pc-scrapper-exact.
          # RE-MEASURE irlba against the branch before trusting its spread.
          - solver: [irlba, random]
            n_components: *n_comps
            random_seed: *seeds
      - id: pc-scrapper-exact
        name: "scrapper PCA (exact SVD, no random start)"
        software_environment: "scrapper"
        repository:
          url: https://github.com/omni-scrna/scrapper
          # stays on the pinned commit: the random-seed fix is irrelevant to a
          # solver that never had a random start.
          commit: 18843a7
          entrypoint: pca
        parameters:
          # MEASURED byte-identical at seed 42 vs 43. random_seed is still
          # passed because the module requires the flag.
          - solver: [exact]
            n_components: *n_comps
            random_seed: 42
      - id: pc-rapids
        name: "rapids-singlecell PCA (GPU)"
        software_environment: "rapids_singlecell"
        # NEEDS omnibenchmark >0.6 (capability gating) 
        # run: --with-capability gpu
        # comment manually to avoid a CUDA error.
        requires_capabilities: [gpu]
        repository:
          url: https://github.com/omni-scrna/rapids-singlecell
          commit: testing
          entrypoint: pca
        parameters:
          # sparse-only solvers: normalized_selected_h5 loads as CSR, and the
          # module raises rather than let rsc silently swap in another solver.
          # full/jacobi are dense-only, so they're out.
          # MEASURED: only randomized-halko responds to the seed;
          # covariance-eigh and lanczos are byte-identical at 42 vs 43 and live
          # in pc-rapids-exact.
          - solver: [randomized-halko]
            n_components: *n_comps
            random_seed: *seeds
      - id: pc-rapids-exact
        name: "rapids-singlecell PCA, GPU (seed-invariant solvers)"
        software_environment: "rapids_singlecell"
        requires_capabilities: [gpu]
        repository:
          url: https://github.com/omni-scrna/rapids-singlecell
          commit: testing
          entrypoint: pca
        parameters:
          # MEASURED byte-identical at seed 42 vs 43 on be1. `lanczos` being
          # seed-invariant is worth an upstream look -- a Lanczos start vector
          # is normally random -- but it measurably is not a sweep axis here.
          - solver: [covariance-eigh, lanczos]
            n_components: *n_comps
            random_seed: 42
      - id: pc-tpca
        name: "Topological PCA (persistent Laplacian)"
        software_environment: "tpca"
        repository:
          url: https://github.com/btraven00/topological-pca
          commit: 8fb9c63
          entrypoint: pca
        parameters:
          # No random_seed, and deliberately NOT on *seeds: tPCA has no RNG
          # (np.eye/np.ones init, deterministic solver), so a seed sweep would
          # run the identical job five times.
          #
          # beta/gamma/zetas are the published GSE82187 values (upstream
          # Tests/paramvals_*.csv). zetas weights one filtration level each, so
          # it's a vector, not a scalar -- it travels as a comma string and is
          # parsed module-side. tpca takes 7 (thresholds), knn-tpca takes 8
          # (neighbour counts 1,3,..,15), hence one parameter set per solver.
          #
          # MEASURED on be1, silhouette vs truth at matched k (scanpy PCA in
          # brackets): k=8 0.407 [0.413], k=20 0.127 [0.327], k=50 -0.012
          # [0.265]. tPCA takes the k SMALLEST eigenvectors, so k is structural,
          # not a budget -- each extra component is a worse direction, and by
          # the stage's fixed 50 the embedding no longer separates the labels at
          # all. Upstream sidesteps this by setting k = the ground-truth cluster
          # count, which a PCA-stage module cannot do (truth is not a stage
          # input). Kept at 50 so the number is comparable to its neighbours;
          # read it as "tPCA at the benchmark's dimensionality", not as tPCA at
          # its best. Comparing at a small k means moving every PCA module to
          # that k too -- a benchmark-wide decision, not this module's.
          #
          # ponytail: fixture-only module. The filtration is dense in cells
          # (n^2 memory, 30 n^3 solves); the module's --max_cells 5000 refuses
          # anything bigger. be1 (1715 cells) runs in ~2s at ~600MB; full pbmc
          # at 157k cells would need ~197GB for one intermediate.
          - solver: [tpca]
            n_components: *n_comps
            beta: 60
            gamma: 1000
            zetas: "0,1,0,4,0,5,1"
          - solver: [knn-tpca]
            n_components: *n_comps
            beta: 60
            gamma: 100000
            zetas: "1,0.5,0.3333333,0.25,0.2,0.16666667,0.14285714,0.125"
      - id: pc-rmt-spca
        name: "RMT-guided sparse PCA (biwhitening + Marchenko-Pastur + FISTA)"
        software_environment: "rmt_spca"
        repository:
          url: https://github.com/btraven00/omni-rmt-spca
          # Pinned. The module in turn pins the algorithm crate at
          # rmt-spca rev a2c6028, so this sha fixes the whole stack.
          commit: fe42154
          entrypoint: pca
        parameters:
          # NO n_components, and deliberately NOT on *n_comps: this module
          # DERIVES k as count(eigenvalue > the MP bulk edge lambda+), which is
          # the whole point of the method. Measured on be1: k=72. Parameters are
          # per-module, so opting out of the anchor needs no separate stage.
          #
          # k_max is a search CEILING, not a target, and the module fails if k
          # saturates it -- the crate's own default of 20 bound on every dataset
          # tested (be1 true k 72, pbmc 394), silently reporting the cap as the
          # answer.
          #
          # bw_damp 0.3, not the crate's 1.0: at 1.0 the Sinkhorn residual lands
          # above 1e-2 on every dataset tested, and the crate then DISCARDS the
          # biwhitening factors for one-sided per-gene standardisation. The
          # module fails rather than benchmark that substitute method.
          - lambda_frac: 0.3
            bw_damp: 0.3
            k_max: 500
      - id: pc-tpca-fast
        name: "Topological PCA (sparse/matvec rewrite)"
        software_environment: "tpca"
        repository:
          url: https://github.com/btraven00/topological-pca
          commit: 8fb9c63
          # Same algorithm as pc-tpca, nothing materialised at n_cells^2.
          # Reproduces the dense path exactly (principal angles 1.0000 on be1
          # at n=1715/4000/8000, both solvers), so running both is a
          # cost-only comparison: same embedding, different resource curve.
          # Measured on be1-derived subsamples, k=50:
          #   n= 4000  dense 2.6GB/12s   sparse 0.6GB/36s
          #   n= 8000  dense 9.8GB/126s  sparse 1.0GB/62s
          #   n=16000  dense ~37GB(est)  sparse 2.0GB/395s
          # Memory is O(n^2) vs O(n) and is genuinely fixed. Time is only
          # improved, not fixed: Lanczos iteration counts grow with n, so wall
          # is ~n^2.5-2.7 and extrapolates to ~2 days at 157k cells. Enough to
          # make pbmc possible, not yet enough to make it routine.
          entrypoint: pca-fast
        parameters:
          - solver: [tpca]
            n_components: *n_comps
            beta: 60
            gamma: 1000
            zetas: "0,1,0,4,0,5,1"
            max_cells: 200000
          - solver: [knn-tpca]
            n_components: *n_comps
            beta: 60
            gamma: 100000
            zetas: "1,0.5,0.3333333,0.25,0.2,0.16666667,0.14285714,0.125"
            max_cells: 200000

  - id: EMBED-M
    inputs:
      - pcas_tsv
      - rawdata_clusters_truth
    outputs:
      - id: embedding_metrics
        path: "{dataset}_embedding_metrics.json"
    modules:
      - id: em-metrics-py
        name: "Embedding metrics in python"
        software_environment: "metrics"
        repository:
          url: https://github.com/omni-scrna/metrics
          commit: 646f1e4
          entrypoint: embedding-py
      # ponytail: dropped em-metrics-r — ~30GB and ~50min+ PER job x40 on full
      # pbmc (O(N^2) in cells), intractable serialized. em-metrics-py covers the
      # same embedding metrics. Re-add on a smaller dataset or bigger box.

  - id: NNG
    inputs:
      - pcas_tsv
    outputs:
      - id: neighbors_h5
        path: "{dataset}_neighbors.h5"
    modules:
      - id: nn-scanpy
        name: "scanpy KNN graph"
        software_environment: "scanpy"
        repository:
          url: https://github.com/omni-scrna/scanpy
          commit: 53eb292
          entrypoint: knn
        parameters:
          - n_neighbors: 15
            random_seed: 42
            flavor: "umap"

  - id: GRAPH-M
    inputs:
      - neighbors_h5
      - rawdata_clusters_truth
    outputs:
      - id: graph_metrics
        path: "{dataset}_graph_metrics.json"
    modules:
      - id: nn-metrics-r
        name: "Graph metrics in R"
        software_environment: "metrics"
        repository:
          url: https://github.com/omni-scrna/metrics
          commit: 646f1e4
          entrypoint: graph-r

  - id: CLUST
    inputs:
      - neighbors_h5
    outputs:
      - id: clusters_tsv
        path: "{dataset}_clusters.tsv"
    modules: 
      - id: cl-scrapper
        name: "Scrapper clustering"
        software_environment: "scrapper"
        repository:
          url: https://github.com/omni-scrna/scrapper
          commit: 8a1cfd8
          entrypoint: cluster
        parameters:
          - flavor: ["leiden_modularity"]
            resolution: [1.0]
            random_seed: 42

  - id: CLUST-M
    inputs:
      - clusters_tsv
      - rawdata_clusters_truth
    outputs:
      - id: cluster_metrics
        path: "{dataset}_cluster_metrics.json"
    modules:
      - id: cl-metrics-r
        name: "Partition metrics in R"
        software_environment: "metrics"
        repository:
          url: https://github.com/omni-scrna/metrics
          commit: 257c952
          entrypoint: cluster-r

  - id: CNTFCT
    resources:
      cores: 4
    inputs:
    - normalized_selected_h5
    - rawdata_h5ad
    - filtered_cellids
    outputs:
    - id: pcas_tsv
      path: '{dataset}_pcas.tsv'
    - id: loadings_tsv
      path: '{dataset}_loadings.tsv'  

    modules:
      - id: pc-onlinepca
        name: "OnlinePCA.jl (raw counts)"
        software_environment: "onlinepca_jl"
        # Consumes rawdata_h5ad + filtered_cellids; OnlinePCA.jl is
        # integer-counts-only (its loaders parse matrix/data into Vector{Int}),
        # so it can't use normalized_selected_h5 -- it reads only matrix/genes
        # from that file, to stay on the same HVG set as the other modules.
        repository:
          url: https://github.com/btraven00/pca-onlinepca.jl
          # branch, like pc-rapids' `testing`; pin a sha once the rewire is pushed.
          commit: main
          entrypoint: pca
        parameters:
          # {algorithm}_{scale}. tenxpca only: algorithm971 is wired to mm2bin,
          # whose sparse triplet format OnlinePCA's `init` cannot read (it reads
          # the dense csv2bin layout) -- it dies with EOFError after sumr.
          - solver: [tenxpca_sqrt, tenxpca_log]
            n_components: *n_comps
            random_seed: *seeds
  # scSHC lives in its own stage, not as a second CLUST-M module: it emits a
  # different output file (_cluster_shc.json vs _cluster_metrics.json) and needs
  # rawdata_h5ad, which the CLUST-M contract doesn't provide (see the entrypoint's
  # header note). The module still reads the CLUST-M schema (clusters_tsv +
  # rawdata_clusters_truth, truth unused), so this stage feeds those plus counts.
  # - id: CLUST-SHC
  #   resources:
  #     cores: 4
  #   inputs:
  #     - clusters_tsv
  #     - rawdata_clusters_truth
  #     - rawdata_h5ad
  #   outputs:
  #     - id: cluster_shc_metrics
  #       path: "{dataset}_cluster_shc.json"
  #   modules:
  #     - id: cl-shc-r
  #       name: "scSHC cluster significance"
  #       software_environment: "scshc"
  #       repository:
  #         url: https://github.com/btraven00/omni-scrna-metrics
  #         commit: 0f3a87f793dd194c65bca494de142c12456dea2e
  #         entrypoint: cluster-shc-r
